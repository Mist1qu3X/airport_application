version: '3.8'

services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: skycontrol-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: Airport_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend (FastAPI)
  backend:
    build: ./backend
    container_name: skycontrol-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/Airport_system
      SECRET_KEY: 3a5e2b4f9c8d1e7f6a9b0c2d4e8f1a3b5c7d9e2f4a6b8c1d3e5f7a9b1c3d5
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      SMTP_HOST: smtp.mail.ru
      SMTP_PORT: 587
      SMTP_USER: rturdahunov@bk.ru
      SMTP_PASS: mmtRq2emARdxmKawRpHg
      FROM_EMAIL: rturdahunov@bk.ru
      APP_URL: http://localhost
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Hot-reload для разработки
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (React + Nginx)
  frontend:
    build: ./frontend
    container_name: skycontrol-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: